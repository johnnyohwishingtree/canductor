name: Pipeline

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  # Job 1: Dispatch agent for the next pending story
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find and dispatch next story
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          REPO="${{ github.repository }}"

          # Find next pending story
          ISSUE=$(gh issue list --repo "$REPO" --label "story,pending" --state open \
            --json number,title --jq '.[0]')

          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ]; then
            echo "No pending stories"
            exit 0
          fi

          NUMBER=$(echo "$ISSUE" | jq -r '.number')
          TITLE=$(echo "$ISSUE" | jq -r '.title')
          echo "Found story #$NUMBER: $TITLE"

          # Skip if agent is already running
          ACTIVE=$(gh run list --repo "$REPO" --workflow agent.yml --status in_progress \
            --json databaseId --jq 'length')
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Agent already running — skipping dispatch"
            exit 0
          fi

          # Mark in-progress
          gh issue edit "$NUMBER" --repo "$REPO" --remove-label "pending" --add-label "in-progress"

          # Create branch
          SHA=$(gh api "repos/$REPO/git/ref/heads/master" --jq '.object.sha')
          BRANCH="canductor/issue-${NUMBER}"
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$SHA" 2>/dev/null || true

          # Get issue body for prompt
          BODY=$(gh issue view "$NUMBER" --repo "$REPO" --json body --jq '.body')

          # Dispatch agent
          gh workflow run agent.yml --repo "$REPO" \
            -f issue_number="$NUMBER" \
            -f branch="$BRANCH" \
            -f prompt="Read CLAUDE.md first for project context.

          Implement this issue:
          Title: $TITLE

          $BODY

          After implementing:
          1. Run pnpm typecheck && pnpm test
          2. git add changed files
          3. git commit with message containing 'Closes #$NUMBER'
          4. git push origin $BRANCH

          Closes #$NUMBER"

          # Wait for the run to appear so we can link to it
          sleep 5
          RUN_ID=$(gh run list --repo "$REPO" --workflow agent.yml --limit 1 \
            --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")

          if [ -n "$RUN_ID" ]; then
            RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          else
            RUN_URL="https://github.com/$REPO/actions/workflows/agent.yml"
          fi

          gh issue comment "$NUMBER" --repo "$REPO" \
            --body "Pipeline picked up this story. Agent working on branch [\`$BRANCH\`](https://github.com/$REPO/tree/$BRANCH).

          **[View agent run →]($RUN_URL)**"

  # Job 2: Check in-progress stories — create PRs, verify, merge
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build canductor
        run: npm install -g pnpm && pnpm install && pnpm build

      - name: Process in-progress stories
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          REPO="${{ github.repository }}"

          gh issue list --repo "$REPO" --label "story,in-progress" --state open \
            --json number --jq '.[].number' | while read -r NUMBER; do

            BRANCH="canductor/issue-${NUMBER}"
            echo "=== Checking story #$NUMBER ($BRANCH) ==="

            # Check if branch has commits ahead of master
            AHEAD=$(gh api "repos/$REPO/compare/master...$BRANCH" \
              --jq '.ahead_by' 2>/dev/null || echo "0")

            if [ "$AHEAD" -eq 0 ]; then
              echo "No commits yet — agent still working"
              continue
            fi

            # Check if agent is still running for this branch
            AGENT_RUNNING=$(gh run list --repo "$REPO" --workflow agent.yml --status in_progress \
              --branch "$BRANCH" --json databaseId --jq 'length' 2>/dev/null || echo "0")

            if [ "$AGENT_RUNNING" -gt 0 ]; then
              echo "Agent still running on this branch"
              continue
            fi

            echo "Agent finished with $AHEAD commits"

            # Run canductor verify inline
            echo "--- Running canductor verify ---"
            git fetch origin "$BRANCH"
            git checkout "origin/$BRANCH" -- . 2>/dev/null || true

            SCORE=$(node packages/cli/dist/cli.js score "$NUMBER" 2>/dev/null || echo "0")
            echo "Canductor score: $SCORE/100"

            # Check if PR already exists
            EXISTING_PR=$(gh pr list --repo "$REPO" --head "$BRANCH" \
              --json number --jq '.[0].number' 2>/dev/null || echo "")

            if [ -z "$EXISTING_PR" ]; then
              # Create PR
              TITLE=$(gh issue view "$NUMBER" --repo "$REPO" --json title --jq '.title')
              echo "Creating PR for story #$NUMBER"
              EXISTING_PR=$(gh pr create --repo "$REPO" --head "$BRANCH" --base master \
                --title "$TITLE" \
                --body "Closes #$NUMBER

          Canductor score: **$SCORE/100**

          Autonomously implemented by canductor pipeline." 2>&1 | grep -oE '[0-9]+$' || echo "")

              if [ -z "$EXISTING_PR" ]; then
                echo "Failed to create PR"
                continue
              fi

              gh issue comment "$NUMBER" --repo "$REPO" \
                --body "Agent finished. Created [PR #$EXISTING_PR](https://github.com/$REPO/pull/$EXISTING_PR). Canductor score: **$SCORE/100**."
            fi

            # Merge the PR
            echo "Merging PR #$EXISTING_PR"
            if gh pr merge "$EXISTING_PR" --repo "$REPO" --squash --admin; then
              echo "Merged! Closing story #$NUMBER"
              gh issue edit "$NUMBER" --repo "$REPO" \
                --remove-label "in-progress" --add-label "completed"
              gh issue close "$NUMBER" --repo "$REPO" 2>/dev/null || true

              gh issue comment "$NUMBER" --repo "$REPO" \
                --body "✓ Story complete. [PR #$EXISTING_PR](https://github.com/$REPO/pull/$EXISTING_PR) merged. Score: **$SCORE/100**."
            else
              echo "Could not merge PR #$EXISTING_PR"
            fi

            # Reset checkout for next iteration
            git checkout HEAD -- . 2>/dev/null || true

          done
