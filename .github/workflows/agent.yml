name: Agent
on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      branch:
        required: true
        type: string
      prompt:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject quality context into CLAUDE.md
        run: |
          npm install -g pnpm && pnpm install && pnpm build
          node packages/cli/dist/cli.js inject CLAUDE.md
          git config user.name "canductor[bot]"
          git config user.email "canductor[bot]@users.noreply.github.com"
          git add CLAUDE.md
          git diff --cached --quiet || git commit -m "chore: inject canductor quality context [skip ci]"
          git push origin "${{ inputs.branch }}" || true

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          prompt: ${{ inputs.prompt }}
          claude_args: --allowedTools "Edit" "MultiEdit" "Glob" "Grep" "LS" "Read" "Write" "Bash(*)"
          settings: '{"maxTurns": 25}'
